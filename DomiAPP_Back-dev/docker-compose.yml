services:
  oracle-ref:
    image: store/oracle/database-enterprise:12.2.0.1-slim
    container_name: oracle-ref
    environment:
      - ORACLE_SID=XE
      - ORACLE_PDB=ref
      - ORACLE_PWD=ref
      - ORACLE_CHARACTERSET=AL32UTF8
    ports:
      - 1522:1521
    volumes:
      - oracle-ref-data:/opt/oracle/oradata
    networks:
      - microservices-net

    restart: unless-stopped

  oracle-domi:
    image: store/oracle/database-enterprise:12.2.0.1-slim
    container_name: oracle-domi
    environment:
      - ORACLE_SID=XE
      - ORACLE_PDB=domi
      - ORACLE_PWD=domi
      - ORACLE_CHARACTERSET=AL32UTF8
    ports:
      - 1523:1521
    volumes:
      - oracle-domi-data:/opt/oracle/oradata
    networks:
      - microservices-net
    restart: unless-stopped
  mail-dev:
    container_name: ms_mail_dev
    image: maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025

networks:
  microservices-net:
    driver: bridge

volumes:
  oracle-ref-data:
  oracle-domi-data:


