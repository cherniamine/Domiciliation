<body class="custom">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"/>

  <div class="accord-bct-container">
    <h3 class="title">Créer un Accord BCT</h3>
    <form [formGroup]="accordForm" (ngSubmit)="onSubmit()">
      
      <!-- Matricule Fiscale -->
      <div class="form-group row">
        <label for="noPieceClient">Matricule Fiscale :</label>
        <input 
          type="text" 
          name="noPieceClient" 
          id="noPieceClient" 
          class="form-control" 
          formControlName="noPieceClient" 
          (change)="onNoPieceClientChange()" 
          placeholder="Entrez le RNE">
        <div *ngIf="!depotDomiTitre.noPieceClient || depotDomiTitre.noPieceClient.trim() === ''" class="wizard-form-error">
        </div>
      </div>

      <div class="nom-prenom-container" *ngIf="nomPrenom">
        <span class="nom-prenom">{{ nomPrenom }}</span>
      </div>
      
      <!-- Type Accord BCT -->
      <div class="form-group row">
        <label for="typeAccord">Type Accord BCT :</label>
        <select id="typeAccord" class="form-control" formControlName="typeAccord">
          <option value="" disabled>Choisir un type</option>
          <option *ngFor="let type of typeAccordList" [value]="type">{{ type }}</option>
        </select>
        <div class="wizard-form-error" style="display: none;"></div>
      </div>

      <!-- Numéro Accord -->
      <div class="form-group row">
        <label for="numAccord">Numéro Accord :</label>
        <input id="numAccord" type="text" formControlName="numAccord" class="form-control" />
        <div class="wizard-form-error" style="display: none;"></div>
      </div>
      
      <!-- Date Accord -->
    <div class="form-group row">
      <label for="dateAccord">Date Accord :</label>
      <input 
        id="dateAccord" 
        type="date" 
        formControlName="dateAccord" 
        class="form-control" 
        (change)="validateDates()" />
    </div>

          <!-- Date Début Effet -->
    <div class="form-group row">
      <label for="dateDebutEffet">Date Début Effet :</label>
      <input 
        id="dateDebutEffet" 
        type="date" 
        formControlName="dateDebutEffet" 
        class="form-control" 
        (change)="validateDates()" />
      <div *ngIf="dateDebutEffetError" class="wizard-form-error">
        {{ dateDebutEffetError }}
      </div>
    </div>

        <!-- Date Fin Effet -->
        <div class="form-group row">
          <label for="dateFinEffet">Date Fin Effet :</label>
          <input 
            id="dateFinEffet" 
            type="date" 
            formControlName="dateFinEffet" 
            class="form-control" 
            (change)="validateDates()" />
          <div *ngIf="dateFinEffetError" class="wizard-form-error">
            {{ dateFinEffetError }}
          </div>
        </div>


      <!-- Observation -->
      <div class="form-group row">
        <label for="observation">Observation :</label>
        <textarea id="observation" formControlName="observation" rows="4" class="form-control"></textarea>
      </div>

      <div class="form-group row">
        <!-- Label et champ de sélection de fichiers -->
        <div class="col-md-8 d-flex align-items-center">
          <label for="files" class="form-label mr-2" style="margin-left:78px ;">Pièces Jointes :</label>
          <input
            id="files"
            type="file"
            class="form-control custom-file-input"
            (change)="onFileChange($event)"
            multiple
          />
        </div>
      
        <!-- Bouton Voir Fichiers ajoutés -->
        <div class="col-md-4 text-right custom-container" style="margin-left: 450px">
          <button
            type="button"
            class="bttn btn-link file-list-toggle"
            (click)="toggleFileList()"
          >
            Voir Fichiers ajoutés
          </button>
        </div>
      </div>
      
     <!-- Tableau des fichiers ajoutés -->
<div *ngIf="isFileListVisible" class="file-modal">
  <div class="file-modal-content">
    <div class="file-modal-header">
      <h3>Fichiers ajoutés</h3>
      <button type="button" class="close-btn" (click)="toggleFileList()">&times;</button>
    </div>

    <!-- Table des fichiers -->
    <div class="file-modal-body">
      <table class="styled-table">
        <thead>
          <tr>
            <th></th>
            <th>Nom du fichier</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let fileName of selectedFileNames; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ fileName }}</td>
            <td>
             
               <!-- ouvrir le fichier -->
               <button
               type="button"
               (click)="openFile(selectedFiles[i])"
               class="bttn btn-warning btn-sm"  style="margin-right: 10px">
               <i class="bi bi-eye"></i>
              
             </button>

             <button
             type="button"
             (click)="removeFile(fileName)"
             class="bttn btn-danger btn-sm">
             <i class="bi bi-trash"></i>
           </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

    

      <button type="submit" class="precident" style="margin-left: 500px;" >Enregistrer</button>
    </form> 
  </div>
</body>
